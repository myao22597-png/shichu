<body>

<div class="wrap">
  <header class="hero">
    <p class="hero-k">四柱推命 ― 命式鑑定</p>
    <h1>容赦なき四柱推命</h1>
    <p class="threat">生年月日と時刻と出生地から、あなたの命式を出します。手加減はしません。</p>
    <p>節入りの時刻で月を切り替え、出生地の経度と均時差から真太陽時を求めて時柱を出す、本格的な計算です。</p>
  </header>
  <div class="modes" role="tablist" aria-label="占いの種類">
    <button type="button" role="tab" id="tab-solo" class="mode" aria-selected="true">個人占い</button>
    <button type="button" role="tab" id="tab-pair" class="mode" aria-selected="false">相性占い</button>
  </div>
  <form id="form" novalidate data-mode="solo">
    <fieldset id="fs-a" class="person"><legend>あなた</legend></fieldset>
    <fieldset id="fs-b" class="person" hidden><legend>相手</legend></fieldset>
    <div class="submit-row"><button type="submit" class="btn" id="submitBtn">鑑定する</button><p id="formErr" role="alert"></p></div>
  </form>
  <div id="result"></div>
  <footer>
    <p>入力した内容はどこにも送信されません。計算はすべてこの画面の中で行っています。</p>
    <p>日の切り替えは真太陽時の0時、23時台の時柱は翌日の干で取っています。節入りの前後十数分に生まれた方は、月柱が流派によって変わることがあります。</p>
    <p>鑑定文は娯楽です。人生の重大な判断は、命式ではなくあなた自身で。</p>
  </footer>
</div>

<script>
const STEMS='甲乙丙丁戊己庚辛壬癸';
const BRANCHES='子丑寅卯辰巳午未申酉戌亥';
const ELEM=['木','火','土','金','水'];
const BRANCH_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];
const TEN=['比肩','劫財','食神','傷官','偏財','正財','偏官','正官','偏印','印綬'];
const TWELVE=['長生','沐浴','冠帯','建禄','帝旺','衰','病','死','墓','絶','胎','養'];
const CHOSEI=[11,6,2,9,2,9,5,0,8,3];
const RAD=Math.PI/180;
const norm=a=>((a%360)+360)%360;
const jdFromMs=ms=>ms/864e5+2440587.5;
const msFromJd=jd=>(jd-2440587.5)*864e5;

function sunInfo(jd){
  const T=(jd-2451545)/36525;
  const L0=norm(280.46646+36000.76983*T+0.0003032*T*T);
  const M=norm(357.52911+35999.05029*T-0.0001537*T*T);
  const e=0.016708634-0.000042037*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*RAD)+(0.019993-0.000101*T)*Math.sin(2*M*RAD)+0.000289*Math.sin(3*M*RAD);
  const om=125.04-1934.136*T;
  const lam=norm(L0+C-0.00569-0.00478*Math.sin(om*RAD));
  const eps=23.439291-0.0130042*T+0.00256*Math.cos(om*RAD);
  const y=Math.tan(eps*RAD/2)**2, L=L0*RAD, Mr=M*RAD;
  const E=y*Math.sin(2*L)-2*e*Math.sin(Mr)+4*e*y*Math.sin(Mr)*Math.cos(2*L)-0.5*y*y*Math.sin(4*L)-1.25*e*e*Math.sin(2*Mr);
  return {lam, eot:E/RAD*4};
}
function findTerm(jd,target){
  for(let i=0;i<10;i++){
    const d=norm(target-sunInfo(jd).lam+180)-180;
    jd+=d/0.98564736;
    if(Math.abs(d)<1e-7)break;
  }
  return jd;
}
const combine=(s,b)=>((6*s-5*b)%60+60)%60;
const tenGod=(D,X)=>{const diff=(Math.floor(X/2)-Math.floor(D/2)+5)%5;return TEN[diff*2+(D%2===X%2?0:1)];};
const tenIdx=(D,X)=>{const diff=(Math.floor(X/2)-Math.floor(D/2)+5)%5;return diff*2+(D%2===X%2?0:1);};
const twelve=(D,b)=>TWELVE[D%2===0?(b-CHOSEI[D]+12)%12:(CHOSEI[D]-b+12)%12];
const branchElem=b=>Math.floor(BRANCH_MAIN[b]/2);

function inDstJP(y,m,d){
  const r={1948:[[5,2],[9,11]],1949:[[4,3],[9,10]],1950:[[5,7],[9,9]],1951:[[5,6],[9,8]]}[y];
  if(!r)return false;
  const v=m*100+d;
  return v>=r[0][0]*100+r[0][1] && v<=r[1][0]*100+r[1][1];
}

function compute(inp,nowMs){
  let offset=inp.tz, dst=false;
  if(inp.isJapan && inp.timeKnown && inDstJP(inp.y,inp.m,inp.d)){offset+=1;dst=true;}
  const h0=inp.timeKnown?inp.hh+inp.mm/60:12;
  const utcMs=Date.UTC(inp.y,inp.m-1,inp.d)+(h0-offset)*3600e3;
  const jd=jdFromMs(utcMs)+69/86400;
  const {lam,eot}=sunInfo(jd);
  let sy=inp.y; if(inp.m<=2 && lam>=250 && lam<315) sy--;
  const yIdx=((sy-4)%60+60)%60, yS=yIdx%10, yB=yIdx%12;
  const mi=Math.floor(norm(lam-315)/30);
  const mS=((yS%5)*2+2+mi)%10, mB=(2+mi)%12;
  const lngCorr=(inp.lng-offset*15)*4; // minutes vs clock meridian (clock incl. DST)
  let dY=inp.y,dM=inp.m,dD=inp.d,solarH=null;
  if(inp.timeKnown){
    const solarMs=utcMs+(inp.lng/15)*3600e3+eot*60e3;
    const sd=new Date(solarMs);
    dY=sd.getUTCFullYear();dM=sd.getUTCMonth()+1;dD=sd.getUTCDate();
    solarH=sd.getUTCHours()+sd.getUTCMinutes()/60+sd.getUTCSeconds()/3600;
  }
  const jdn=Math.floor(Date.UTC(dY,dM-1,dD)/864e5)+2440588;
  const dIdx=(jdn+49)%60, dS=dIdx%10, dB=dIdx%12;
  let hS=null,hB=null;
  if(solarH!==null){
    hB=Math.floor((solarH+1)/2)%12;
    const ds=solarH>=23?(dS+1)%10:dS;
    hS=((ds%5)*2+hB)%10;
  }
  // luck pillars
  let luck=null;
  const mIdx=combine(mS,mB);
  if(inp.gender==='m'||inp.gender==='f'){
    const yang=yS%2===0;
    const fwd=(yang&&inp.gender==='m')||(!yang&&inp.gender==='f');
    let days;
    if(fwd){const t=findTerm(jd+norm(315+30*(mi+1)-lam)/0.9856,315+30*(mi+1));days=t-jd;}
    else{const t=findTerm(jd-norm(lam-(315+30*mi))/0.9856,315+30*mi);days=jd-t;}
    const start=days/3;
    const age=(nowMs-utcMs)/(365.2422*864e5);
    const pillars=[];
    for(let k=1;k<=8;k++){
      const idx=((mIdx+(fwd?k:-k))%60+60)%60;
      const a=start+10*(k-1);
      pillars.push({s:idx%10,b:idx%12,age:a,current:age>=a&&age<a+10});
    }
    luck={fwd,start,pillars,age,before:age<start};
  }
  return {yS,yB,mS,mB,dS,dB,hS,hB,dIdx,lam,eot,dst,lngCorr,solarH,offset,luck,utcMs,
    solarDate:[dY,dM,dD]};
}

function solarYearNow(nowMs){
  const d=new Date(nowMs+9*3600e3);
  const y=d.getUTCFullYear(),m=d.getUTCMonth()+1;
  const lam=sunInfo(jdFromMs(nowMs)).lam;
  return (m<=2&&lam>=250&&lam<315)?y-1:y;
}
if(typeof module!=='undefined')module.exports={compute,sunInfo,findTerm,jdFromMs,msFromJd,STEMS,BRANCHES,tenGod,twelve,solarYearNow};
const T={
DAY:[
 {img:'大樹',core:'まっすぐ伸びることしか知らない木。向上心と正義感は本物ですが、裏返せば「自分が正しい」という確信の強さでもあります。曲がって生きる人を内心では見下していて、その視線は周りに案外バレています。',weak:'折れない代わりに、しなれない。謝るのが致命的に下手で、人間関係が壊れるときは小さな意地の積み重ねが原因です。上に立つと張り切るのに、地味な下支えに回されると目に見えて腐ります。',line:'あなたが嫌っている頑固な人間は、だいたいあなたの鏡です。'},
 {img:'草花',core:'草花、あるいは蔓。柔らかく見えて、実は誰より生き残る力が強い人です。強い人や環境に巻きつき、そこから栄養を取るのが本能的に上手い。協調性と言えば聞こえはいいですが、要は寄りかかる先を嗅ぎ分ける嗅覚です。',weak:'表では合わせ、裏で根に持つ。不満を口にせず態度でにじませるので、周りは理由も分からず気まずくなります。寄りかかる先がなくなると、一気にしおれる脆さもあります。',line:'あなたの「大丈夫」を信じている人は、もうほとんどいません。'},
 {img:'太陽',core:'太陽。明るく、場の中心にいるのが自然な人です。ただ、太陽は照らしている相手の顔をいちいち見ていません。悪気なく人を置き去りにし、置き去りにしたことにも気づかない。',weak:'注目されないと急に元気がなくなります。始めるのは誰より速いのに、地味な後半戦は他人に押しつける。熱しやすく冷めやすいのは、恋愛でも仕事でも同じです。',line:'あなたが去ったあとの場は、あなたが思うよりずっと早く平熱に戻ります。'},
 {img:'灯火',core:'ろうそくの火。静かで繊細、人の心の機微を読む力は十干で随一です。ただしその洞察力は、他人の欠点を見抜くためにも全力で使われています。優しい顔の裏で、相手の点数をずっとつけている人です。',weak:'感情の火が消えにくい。一度傷つくと何年でも覚えていて、関係を切るときは予告なしで静かに切ります。神経質さを「繊細」と言い換えて、自分を守っている節もあります。',line:'あなたが黙った時が一番怖い。周りはもう、それを知っています。'},
 {img:'山',core:'山。どっしりして頼もしく、人が自然と集まります。ただ、山は自分からは一歩も動きません。変化を嫌い、自分のやり方が通る範囲から出ようとしない保守性は、年を取るほど頑固さに変わります。',weak:'とにかく腰が重い。決断を先送りし、気づいた時には周りが先に動いています。懐が深いように見えて、実は面倒を抱え込んで処理していないだけのことも多いはずです。',line:'待っていれば何とかなった時代は、もう終わっています。'},
 {img:'田畑',core:'田畑の土。人を育て、受け入れる器の人です。面倒見がよく、気配りも細かい。ただ、その世話焼きは「必要とされていたい」という欲求と表裏一体で、自分がいないと回らない状況をこっそり作りがちです。',weak:'考えすぎて動けない。人の評価を気にしすぎて、本音を言うべき場面で言葉を飲み込みます。溜め込んだものは、関係のない場面で愚痴として漏れています。',line:'尽くした分の見返りを、まだ心のどこかで待っていますね。'},
 {img:'鋼の刀',core:'鍛えられた鋼、あるいは刀。決断が速く、白黒をはっきりつけます。正義感と行動力は強力な武器ですが、刀は抜けば周りを切る。言わなくていい一言で、すでに何人かとの関係を終わらせてきたはずです。',weak:'負けず嫌いで、引くことを知りません。叩かれるほど強くなる反面、平穏な環境では退屈して、自分から波風を立てに行きます。',line:'あなたの「はっきり言うタイプ」は、配慮不足と紙一重です。'},
 {img:'宝石',core:'磨かれた宝石。美意識とプライドが高く、自分の価値に敏感な人です。洗練されていて人目を引きますが、扱いを間違えられると深く傷つき、それを決して忘れません。',weak:'傷つきやすさを隠すために冷たく振る舞います。完璧主義で、自分にも他人にも基準が高すぎる。正当に評価されない環境に置かれると、周囲を静かに見限ります。',line:'あなたの美意識は、半分くらい自己防衛でできています。'},
 {img:'大海',core:'大海、あるいは大河。器が大きく、自由で、どこへでも流れていきます。頭の回転が速く発想も豊かですが、ひとつの場所や人に留まることが本質的に苦手。束縛されると全力で逃げます。',weak:'感情の波が大きく、気分で約束を変えます。本人は「自由」と呼びますが、周りから見ればただの無責任な日もある。深く関わったように見えて、心の底は誰にも見せていません。',line:'あなたが一番執着しているのは、「執着しない自分」というイメージです。'},
 {img:'雨露',core:'雨、あるいは霧。静かに染み込み、知らないうちに周りを潤す人です。直感と想像力に優れ、空気を読む力も高い。ただ霧には形がなく、自分が何者なのかは本人が一番分かっていません。',weak:'流されやすく、決めたことをすぐ曖昧にします。現実から逃げて、空想や趣味の世界にこもる癖がある。被害者の位置に立つのが、無意識にとても上手いです。',line:'「なんとなく」で選んだ道の先で、またなんとなく後悔します。'}
],
TEN:{
 '比肩':'我の強さの星。人の話は聞くふりをして、最後は自分で決めたい人です。独立心は才能ですが、協力が必要な場面でも一人で抱え込み、潰れるまで助けを呼びません。',
 '劫財':'負けん気と駆け引きの星。仲間意識が強い反面、身内に対してこそ競争心をむき出しにします。お金は入った瞬間から出口を探している。見栄の出費に心当たりがあるはずです。',
 '食神':'楽しみと食の星。人生を味わう才能はありますが、楽な方へ流れる力も同じくらい強い。「明日やる」が口癖になっていないか。体型と預金残高に正直に出る星です。',
 '傷官':'鋭い感性と、毒の星。才能はありますが、それ以上に批判精神が強い。上の人間の欠点がすべて見えてしまい、隠すのが下手です。組織に向いていない自覚、ありますよね。',
 '偏財':'人とお金を回す星。社交的でサービス精神旺盛、ただし八方美人。誰にでもいい顔をするので、本命からの信頼を落とします。お金も人も、入った分だけ出ていきます。',
 '正財':'堅実と几帳面の星。コツコツ型で信用はされますが、冒険をしません。損をしないことを優先して、得るべきものまで逃しています。倹約とケチの境目を、ときどき越えています。',
 '偏官':'戦いと試練の星。度胸と行動力はありますが、短気で無茶をします。追い込まれると本領を発揮する一方、平時は自分で火種を作りがち。人生に敵が必要な人です。',
 '正官':'規律と体面の星。真面目で責任感が強い優等生。ただ、他人の目が行動の基準になっていて、自分が本当は何をしたいのか分からなくなっています。',
 '偏印':'ひらめきと気まぐれの星。独特の発想力はあるのに、続きません。途中でやめた資格や趣味がいくつあるか数えてみてください。孤独を好むふりをして、本当は理解されたい人です。',
 '印綬':'知性と保護の星。学ぶ力は高いのに、頭でっかちで動きが遅い。守られる環境に慣れていて、自分で稼ぐ・決める段になると誰かを頼ります。プライドの高い受け身です。'
},
LOVE:{
 '比肩':'恋人にも対等さを求めすぎます。甘えるのが下手で、相手に頼られると内心「自分でやって」と思っている。友達のような関係から抜け出せず、気づけば恋人ではなく同居人になっています。',
 '劫財':'好きになるほど張り合います。恋人の成功を素直に喜べない瞬間がある。三角関係や奪い合いに縁がある配置で、ライバルがいると燃え、いなくなると冷めます。',
 '食神':'楽しい恋愛しかしたくない人です。将来の話や重い話になると、さりげなく話題を変える。一緒にいて居心地はいいけれど、相手からは「この人とは真剣な話ができない」と思われています。',
 '傷官':'理想が高く、相手の粗を探します。付き合った瞬間から減点が始まる。言わなくていい一言で、自分から関係を壊すのが得意です。',
 '偏財':'モテますし、本人もそれを分かっています。誰にでも優しく、広く浅い。その優しさこそが、本命を一番不安にさせています。',
 '正財':'条件で相手を選べる冷静な恋愛をします。ただ、安定を優先しすぎて、ときめかない相手とも惰性で続けてしまいます。',
 '偏官':'振り回される恋に惹かれます。危ない相手ほど魅力的に見える。穏やかな人を「物足りない」と切り捨ててきたはずです。',
 '正官':'恋愛にも正解を求めます。世間体と条件のチェックリストが長く、相手に「ちゃんとしていること」を求めすぎて、相手が息苦しくなります。',
 '偏印':'束縛が何より嫌いです。近づかれると離れたくなる。連絡がマメな人ほど面倒に感じて、結局「何を考えているか分からない」と言われます。',
 '印綬':'恋人に親の役割を求めます。尽くされることに慣れていて、自分から与える量が少ないことに気づいていません。'
},
WORK:{
 '比肩':'独立やフリーランスで生きる人です。上司の下では、表面は従っても心は一度も従っていない。チームの成果より自分の成果を優先していて、評価面談のたびにそれが透けています。',
 '劫財':'営業、交渉、競争のある場所で強い人です。ただ、同僚を出し抜くことに快感を覚えるので、社内に敵が多い。',
 '食神':'好きな仕事なら天才的に働き、興味のない仕事は驚くほど手を抜きます。締め切り直前の追い込みで、ずっと帳尻を合わせてきたはずです。',
 '傷官':'技術、創作、専門職で光る才能型です。ただし上司との相性ですべてが決まり、合わない上司の下では実力の半分も出しません。転職が多くなりやすい命式です。',
 '偏財':'人脈で仕事を回す商売人タイプ。ただ同時に抱える案件が多すぎて、どれか一つは必ず燃えています。',
 '正財':'管理、経理、事務の堅実型。ミスが少なく信頼されますが、昇進の場面で「無難すぎる」と言われます。言われたことしかやらない人だと思われている可能性があります。',
 '偏官':'修羅場で光る人です。トラブル対応で輝き、平時はくすぶる。部下や後輩に厳しすぎて、人が離れていきます。',
 '正官':'組織の中で力を出す人です。ルールがある場では強いのに、ルールのない場面で固まる。「指示待ち」と評価されたことが一度はあるはずです。',
 '偏印':'企画や研究のアイデア型。発想は出すのに、形にする前に飽きます。同じ仕事を3年続けると、心が先に辞めています。',
 '印綬':'教育、研究、資格職で生きる人です。知識は豊富なのに動き出しが遅く、勉強している間に、もっと雑な人に先を越されます。'
},
MONEY:{
 none:'財の星が命式に見えません。お金への執着が薄いか、稼ぐ回路が育っていない配置です。この命式でお金を残すには、才能より管理が要ります。',
 heavyWeak:'財多身弱。お金の話はたくさん来るのに、手元に残りません。大きなお金ほど、人を介して出ていきます。',
 rivals:'比劫が強く、お金が人に流れる命式です。奢る、貸す、付き合いで使う。財布の中身は人間関係の維持費になっています。',
 talent:'食傷生財。才能や表現をお金に換える回路があります。会社の給料だけで終わらせるのはもったいない命式です。ただし、本人がその気になれば、の話です。',
 pian:'偏財型。入るときは大きく、出るときも大きい。投資や副業、賭け事に手を出しやすく、収支を記録した瞬間に現実を知ることになります。',
 zheng:'正財型。コツコツ貯める力はあります。ただ守りすぎて、増やす機会を何度も見送っています。'
},
THEME:{'比肩':'自立と孤立','劫財':'競争と散財','食神':'享楽と停滞','傷官':'反発と才能','偏財':'拡大と浪費','正財':'蓄積と保守','偏官':'試練と闘争','正官':'責任と束縛','偏印':'放浪と転機','印綬':'学びと依存'},
YEAR:{
 '比肩':'自我がぶつかる年。仲間だと思っていた相手がライバルに変わりやすく、独断で決めたことほど裏目に出ます。',
 '劫財':'お金が漏れる年。見栄の出費、人に貸したお金、うっかり乗った話。財布の紐を他人に握らせないこと。',
 '食神':'緩む年。楽しいことは増えますが、気が抜けて生活リズムが崩れます。楽をした分のツケは翌年に来ます。',
 '傷官':'口が災いを呼ぶ年。正しいことを言っても角が立ちます。目上との衝突、関係の決裂に要注意。',
 '偏財':'人とお金が大きく動く年。誘いは多いですが、手を広げすぎて全部が中途半端になりがちです。',
 '正財':'地道さが試される年。派手な成果は出ません。ここでサボった人は、数年後に確実に差をつけられます。',
 '偏官':'試練の年。予期しないトラブル、急な責任、強いプレッシャー。逃げると追いかけてくる種類の問題が来ます。',
 '正官':'評価と責任の年。立場は上がりやすい一方、しがらみも増えます。いい人をやりすぎて擦り減らないように。',
 '偏印':'迷いの年。方向転換したくなりますが、思いつきで動くと後悔します。人との縁が薄くなり、孤独を感じやすい。',
 '印綬':'守られる年。学びや援助に恵まれますが、受け身になりすぎて、自分で決める力が鈍ります。'
},
LACK:['木がありません。伸びる力と計画性の「根」が弱い。始めることが苦手で、成長の機会を自分で見送ってきた可能性があります。','火がありません。表現力と情熱が足りない。本当は認められたいのに、それを外に出す方法を知らず、熱くなれないことを冷静さだと思い込んでいます。','土がありません。安定と信用の土台が弱い。足場が定まらず、住む場所・仕事・人間関係が定期的にリセットされやすい配置です。','金がありません。決断力と切り捨てる力が足りない。要らないものも人も手放せず、ずるずる抱えて身動きが取れなくなります。','水がありません。柔軟さと知恵の巡りが悪い。考え方が固まりやすく、行き詰まると別の道を探すより、同じ壁に頭を打ち続けます。'],
EXCESS:['木が多すぎます。理想と主張が強く、周りと衝突しやすい。伸ばしたい枝が多すぎて、どれも中途半端に終わります。','火が多すぎます。感情的で衝動的な燃え尽き型。周りを明るくする以上に、周りを疲れさせていることがあります。','土が多すぎます。頑固で腰が重く、変化に弱い。抱え込んだ心配事が地層のように積み上がっています。','金が多すぎます。言葉が鋭く、白黒をつけたがる。冷たい人だと思われている確率はかなり高いです。','水が多すぎます。考えすぎ、悩みすぎ、流されすぎ。頭の中だけで人生を何周もしています。'],
STRENGTH:{

KUU:['精神世界と理想が強く、現実の評価では満たされません。家や先祖の恩恵を受けにくく、自分の力で一から築くことになる宿命です。','行動が先、考えはあと。忙しく動き回るわりに足元の生活が後回しで、気づけば何も残っていないことがあります。','現実的で冷静、感情より損得で動きます。若いうちに苦労を背負いやすく、人に甘える回路が育ちにくい。','波乱を引き寄せる型。常識の枠からはみ出しがちで、平凡な人生を望んでも周りがそうさせてくれません。','人の中で生きながら、心は孤立しやすい。人のために動いても、報われる形では返ってこないことが多いでしょう。','早くから自立を求められ、目上の縁が薄い。何でも自分で決められる代わりに、誰も助けには来ません。']

T.DAY2=[
 {seen:'周りからは「頼れるけど、ちょっと怖い人」と見られています。意見を求められて答えると、相手はそれ以上反論しなくなる。それを納得と受け取っていますが、実際は諦めです。あなたの前では、みんな少しだけ本音を削って話しています。',cure:'一日一回、自分が間違っていた可能性を口に出して認めてください。「それもあるね」だけでいい。大樹が森の中で生き残るのは、他の木と根を絡め合っているからです。一本で立つ木は、最初の嵐で倒れます。'},
 {seen:'周りからは「感じがいい人」と思われています。ただ、親しくなった人ほど「本音が見えない」「気づいたら距離を置かれていた」と感じている。愛想の良さが、そのまま壁になっています。',cure:'不満は小さいうちに、言葉で伝えてください。態度で察してもらう方法は、相手を疲れさせるだけで何も解決しません。寄りかかる先を一つに絞らず、自分の足でも少し立てるようにしておくこと。'},
 {seen:'周りからは「明るくて楽しい人」。ただ、近い人からは「話を聞いてくれない」「気分屋」とも思われています。あなたが盛り上げた場の後片付けを、誰がしているか見たことがありますか。',cure:'始めたことを一つだけ、最後までやり切ってください。派手さのない終盤戦に付き合える太陽は、ただの眩しい人から、信頼される人に変わります。人の話は、自分の話をしたくなっても最後まで聞くこと。'},
 {seen:'周りからは「穏やかで気が利く人」。でも勘のいい人は、あなたの静かな観察に気づいていて、少し身構えています。あなたが急に連絡を返さなくなると、相手は理由が分からず、何年も引きずります。',cure:'関係を切る前に、一度だけ理由を伝えてください。火は消すより、小さく灯し続ける方が難しい。完璧に分かり合える相手を探すより、少しずれていても温め合える相手を大事にしてください。'},

 {seen:'周りからは「優しくて面倒見のいい人」。ただ、世話を焼かれている側は、感謝と同時に小さな重さも感じています。あなたの「いいよいいよ」が、実は全然よくないことを、相手はうすうす知っています。',cure:'頼まれていない世話を、一週間だけやめてみてください。それで回らなくなるなら、それは相手が自分でやるべきことです。尽くすのは、見返りを期待しなくても平気な範囲までに。'},

function readForm(p,who){
  const W=who?who+'の':'';
  const dv=$(p+'-bdate').value; if(!dv)return {err:W+'生年月日を入力してください。'};
  const [y,m,d]=dv.split('-').map(Number);
  if(y<1900||y>2100)return {err:W+'生年月日は1900年〜2100年の範囲で入力してください。'};
  const timeKnown=!$(p+'-timeUnknown').checked;
  let hh=12,mm=0;
  if(timeKnown){const tv=$(p+'-btime').value;if(!tv)return {err:W+'生まれた時刻を入力するか、「時刻不明」にチェックを入れてください。'};[hh,mm]=tv.split(':').map(Number);}
  let lng,tz=9,isJapan=true,placeName;
  const sel=$(p+'-place');
  if(sel.value==='other'){
    lng=parseFloat($(p+'-lng').value);tz=parseFloat($(p+'-tz').value);isJapan=false;
    if(!isFinite(lng)||lng<-180||lng>180)return {err:W+'経度は −180〜180 の数値で入力してください（東経はプラス）。'};
    if(!isFinite(tz)||tz<-12||tz>14)return {err:W+'時差（UTCとの差）は −12〜14 の数値で入力してください。'};
    placeName=`経度${lng}°`;
  }else{const pr=PREFS[+sel.value];lng=pr[1];placeName=pr[0];}
  return {y,m,d,hh,mm,timeKnown,lng,tz,isJapan,gender:$(p+'-gender').value,placeName};
}
function render(inp,isSample){
  const now=Date.now();
  const r=compute(inp,now);
  const D=r.dS;
  const day=T.DAY[D];
  const cols=[
    {k:'時柱',s:r.hS,b:r.hB},{k:'日柱',s:r.dS,b:r.dB,me:true},{k:'月柱',s:r.mS,b:r.mB},{k:'年柱',s:r.yS,b:r.yB}];
  // chart table
  const cell=(c,f)=>c.s===null?'<td class="na">—</td>':f(c);
  const row=(label,f,cls='')=>`<tr class="${cls}"><th scope="row">${label}</th>${cols.map(c=>cell(c,f)).join('')}</tr>`;
  const table=`<div class="slip-scroll"><table class="slip-table">
    <thead><tr><th></th>${cols.map(c=>`<th scope="col">${c.k}</th>`).join('')}</tr></thead><tbody>
    ${row('通変星',c=>`<td class="tg">${c.me?'<span class="seal">日主</span>':tenGod(D,c.s)}</td>`)}
    ${row('天干',c=>`<td class="big e${Math.floor(c.s/2)}">${STEMS[c.s]}</td>`,'r-stem')}
    ${row('地支',c=>`<td class="big e${branchElem(c.b)}">${BRANCHES[c.b]}</td>`,'r-branch')}
    ${row('蔵干',c=>`<td>${STEMS[BRANCH_MAIN[c.b]]}</td>`)}
    ${row('蔵干通変',c=>`<td class="tg">${tenGod(D,BRANCH_MAIN[c.b])}</td>`)}
    ${row('十二運',c=>`<td class="tg">${twelve(D,c.b)}</td>`)}
    </tbody></table></div>`;
  // elements
  const stems=[r.yS,r.mS,r.dS].concat(r.hS===null?[]:[r.hS]);
  const brs=[r.yB,r.mB,r.dB].concat(r.hB===null?[]:[r.hB]);
  const cnt=[0,0,0,0,0];
  stems.forEach(s=>cnt[Math.floor(s/2)]++);brs.forEach(b=>cnt[branchElem(b)]++);
  const total=stems.length+brs.length, maxC=Math.max(...cnt,1);
  const bars=cnt.map((n,i)=>`<div class="bar-row"><span class="bar-k e${i}">${ELEM[i]}</span><span class="bar-track"><span class="bar-fill f${i}" style="width:${n/maxC*100}%"></span></span><span class="bar-n">${n}</span></div>`).join('');
  const elemNotes=[];
  cnt.forEach((n,i)=>{if(n===0)elemNotes.push(T.LACK[i]);else if(n/total>=0.45)elemNotes.push(T.EXCESS[i]);});
  if(!elemNotes.length)elemNotes.push('極端な欠けも偏りもありません。ただし、どこにも突き抜けていないので、本気を出す理由を自分で作らないと一生「そこそこ」で終わります。');
  // strength
  const eD=Math.floor(D/2), sup=[eD,(eD+4)%5];
  let sp=0,tp=0;
  const addP=(e,w)=>{tp+=w;if(sup.includes(e))sp+=w;};
  [r.yS,r.mS,r.hS].forEach(s=>{if(s!==null)addP(Math.floor(s/2),1);});
  brs.forEach(b=>addP(branchElem(b),1));addP(branchElem(r.mB),1);
  const ratio=sp/tp;
  const stKey=ratio>=0.5?'strong':ratio<=0.3?'weak':'mid';const st=T.STRENGTH[stKey];
  // main star
  const score={};
  const addS=(x,w)=>{const g=tenGod(D,x);score[g]=(score[g]||0)+w;};
  [r.yS,r.mS,r.hS].forEach(s=>{if(s!==null)addS(s,1);});
  brs.forEach(b=>addS(BRANCH_MAIN[b],1));addS(BRANCH_MAIN[r.mB],1);
  const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const main=ranked[0][0], second=ranked[1]&&ranked[1][1]>=2?ranked[1][0]:null;
  // plain ten-god counts
  const tgc={};const addC=x=>{const k=tenGod(D,x);tgc[k]=(tgc[k]||0)+1;};
  [r.yS,r.mS,r.hS].forEach(s=>{if(s!==null)addC(s);});brs.forEach(b=>addC(BRANCH_MAIN[b]));
  const c=k=>tgc[k]||0;
  // love
  const spouseTg=tenGod(D,BRANCH_MAIN[r.dB]);
  const loveNotes=[T.LOVE[spouseTg],T.LOVE_DAY[D]];
  if(inp.gender==='f'||inp.gender==='m'){
    const n=inp.gender==='f'?c('正官')+c('偏官'):c('正財')+c('偏財');
    const star=inp.gender==='f'?'官星':'財星';
    if(n===0)loveNotes.push(`命式に配偶者の星（${star}）が見えません。恋愛を後回しにしても困らない構造で、自分から本気で探さない限り、縁は向こうから来ません。`);
    else if(n>=3)loveNotes.push(`配偶者の星（${star}）が${n}つもあります。縁は多いのに一人に絞れないか、同じタイプの相手で同じ失敗を繰り返す配置です。`);
  }
  if([r.yB,r.mB,r.hB].some(b=>b!==null&&(b+6)%12===r.dB))loveNotes.push('さらに日支（配偶者の座）が他の柱と冲しています。家庭や結婚生活が落ち着きにくく、離れて暮らすことや別れに縁がある配置です。');
  // money
  const zai=c('正財')+c('偏財'), shoku=c('食神')+c('傷官'), hikou=c('比肩')+c('劫財');
  const moneyNotes=[];
  if(zai===0)moneyNotes.push(T.MONEY.none);
  else if(zai>=3&&st===T.STRENGTH.weak)moneyNotes.push(T.MONEY.heavyWeak);
  if(hikou>=3)moneyNotes.push(T.MONEY.rivals);
  if(shoku>=2&&zai>=1&&moneyNotes.length<2)moneyNotes.push(T.MONEY.talent);
  if(zai>=1&&moneyNotes.length<2)moneyNotes.push(c('偏財')>c('正財')?T.MONEY.pian:T.MONEY.zheng);
  // summary
  const maxE=cnt.indexOf(Math.max(...cnt)), lackE=cnt.map((n,i)=>n===0?ELEM[i]:null).filter(Boolean);
  const yTgNow=tenGod(D,((solarYearNow(now)-4)%10+10)%10);
  const summary=`あなたは${STEMS[D]}、つまり「${day.img}」の人です。命式は${st[0]}で、いちばん強く出ているのは${main}。この人生の主題は「${T.THEME[main]}」です。五行は${ELEM[maxE]}に偏り${lackE.length?`、${lackE.join('と')}が欠けています`:'、欠けている要素はありません'}。今年は${yTgNow}の年で、テーマは「${T.THEME[yTgNow]}」。以下、遠慮なく読み上げます。`;
  // kuubou
  const g=Math.floor(r.dIdx/10), k1=(10-2*g+12)%12, k2=k1+1;
  const sy=solarYearNow(now);
  const yrs=[];for(let y=sy;y<=sy+12&&yrs.length<2;y++){const b=((y-4)%12+12)%12;if(b===k1||b===k2)yrs.push(y);}
  const inKuu=yrs[0]===sy;
  const kuuLine=inKuu?`<p class="warn">${sy}年はまさに天中殺の最中です。${yrs[1]===sy+1?`${sy+1}年まで続きます。`:''}大きな決断ほど、時期をずらす価値があります。</p>`:`<p>次の天中殺は <b>${yrs.join('年・')}年</b>。今から数えて${yrs[0]-sy}年後です。</p>`;
  // flowing years
  const flow=[sy,sy+1].map(y=>{const idx=((y-4)%60+60)%60, s=idx%10,b=idx%12;const tg=tenGod(D,s);
    const clash=(b+6)%12===r.dB;
    return `<div class="year"><div class="year-h"><span class="year-n">${y}</span><span class="year-p">${P(s,b)}</span><span class="chip">${tg}</span></div><p>${T.YEAR[tg]}</p><ul class="areas">${T.YEAR_AREA[tg].map(t=>{const [k,v]=t.split('：');return `<li><b>${k}</b>${v}</li>`;}).join('')}</ul>${clash?'<p class="warn">さらにこの年の干支は日支と冲（ぶつかり合い）。パートナー、家、自分の足元が揺さぶられる年回りです。</p>':''}</div>`;}).join('');
  // luck
  let luckHtml='<p class="muted">性別を選ぶと、10年ごとの運気の流れ（大運）を表示します。</p>';
  if(r.luck){
    const L=r.luck;const cur=L.pillars.find(p=>p.current);
    const ageStr=a=>{const y=Math.floor(a),m=Math.floor((a-y)*12);return `${y}歳${m?m+'ヶ月':''}`;};
    luckHtml=`<p class="muted">${L.fwd?'順行':'逆行'}・${ageStr(L.start)}から10年ごとに切り替わります。</p>
    <div class="luck-scroll"><ol class="luck">${L.pillars.map(p=>{const tg=tenGod(D,p.s);return `<li class="${p.current?'now':''}"><span class="l-age">${ageStr(p.age)}〜</span><span class="l-p">${P(p.s,p.b)}</span><span class="l-tg">${tg}</span><span class="l-th">${T.THEME[tg]}</span></li>`;}).join('')}</ol></div>
    ${cur?`<p>今は<b>${P(cur.s,cur.b)}</b>の大運、テーマは「${T.THEME[tenGod(D,cur.s)]}」。${T.TEN[tenGod(D,cur.s)].split('。')[1]||''}。</p>`:L.before?'<p>まだ最初の大運に入る前です。</p>':''}`;
  }
  // meta line
  const meta=[`${inp.y}年${inp.m}月${inp.d}日`,inp.timeKnown?`${pad(inp.hh)}:${pad(inp.mm)}`:'時刻不明',inp.placeName,{f:'女性',m:'男性'}[inp.gender]||''].filter(Boolean).join('　');
  const corr=inp.timeKnown?`真太陽時 ${fmtH(r.solarH)}（経度補正 ${sgn(r.lngCorr)}・均時差 ${sgn(r.eot)}${r.dst?'・サマータイム −60分':''}）`:'時刻不明のため時柱なしの三柱で鑑定';
  shareText=`【容赦なき四柱推命】私の日主は「${STEMS[D]}・${day.img}」。\n「${day.line}」\n主星は${main}、天中殺は${BRANCHES[k1]}${BRANCHES[k2]}。\n#容赦なき四柱推命`;
  $('result').innerHTML=`
  ${isSample?'<p class="sample">これはサンプル鑑定です（1990年6月15日 12:30 東京都生まれ・女性）。上のフォームにあなたの生年月日を入れてください。</p>':''}
  <p class="meta">${meta}<br><span class="muted">${corr}</span></p>
  <section class="slip" aria-label="命式">
    <h2 class="slip-h">命式</h2>
    ${table}
  </section>
  <section class="block">
    <p class="eyebrow">総評</p>
    <p class="summary">${summary}</p>
  </section>
  <section class="block">
    <p class="eyebrow">本質 ― 日主</p>
    <h2 class="day-h"><span class="day-stem e${eD}">${STEMS[D]}</span><span class="day-img">${day.img}</span></h2>
    <p>${day.core}</p>
    <p>${day.weak}</p>
    <h3>周りからの見え方</h3>
    <p>${T.DAY2[D].seen}</p>
    <blockquote class="verdict">${day.line}</blockquote>
    <h3>処方箋</h3>
    <p>${T.DAY2[D].cure}</p>
  </section>
  <section class="block">
    <p class="eyebrow">主星 ― いちばん強く出ている性質</p>
    <h2><span class="chip big-chip">${main}</span>${second?`<span class="chip">${second}</span>`:''}</h2>
    <p>${T.TEN[main]}</p>
    ${second?`<p class="muted">二番手の${second}：${T.TEN[second]}</p>`:''}
  </section>
  <section class="block">
    <p class="eyebrow">恋愛 ― 配偶者の座は${spouseTg}</p>
    <h2>恋愛運</h2>
    ${loveNotes.map((t,i)=>`<p class="${i>0&&t.startsWith('さらに')?'warn':''}">${t}</p>`).join('')}
  </section>
  <section class="block">
    <p class="eyebrow">仕事 ― 主星${main}から</p>
    <h2>仕事運</h2>
    <p>${T.WORK[main]}</p>
    <p>${T.WORK_ST[stKey]}</p>
  </section>
  <section class="block">
    <p class="eyebrow">金運 ― 財星${zai}・食傷${shoku}・比劫${hikou}</p>
    <h2>金運</h2>
    ${moneyNotes.map(t=>`<p>${t}</p>`).join('')}
  </section>
  <section class="block">
    <p class="eyebrow">五行の偏り</p>
    <div class="bars" role="img" aria-label="五行の数 木${cnt[0]} 火${cnt[1]} 土${cnt[2]} 金${cnt[3]} 水${cnt[4]}">${bars}</div>
    ${elemNotes.map(t=>`<p>${t}</p>`).join('')}
    <h3>${st[0]}</h3><p>${st[1]}</p>
  </section>
  <section class="block">
    <p class="eyebrow">天中殺</p>
    <h2>${BRANCHES[k1]}${BRANCHES[k2]}天中殺</h2>
    <p>${T.KUU[g]}</p>
    ${kuuLine}
    <p class="muted">${T.KUU_INFO}</p>
  </section>
  <section class="block">
    <p class="eyebrow">今年と来年</p>
    ${flow}
  </section>
  <section class="block">
    <p class="eyebrow">大運 ― 10年ごとの流れ</p>
    ${luckHtml}
  </section>
  ${shareHtml()}`;
  bindShare();
}

function elemCount(r){
  const c=[0,0,0,0,0];
  [r.yS,r.mS,r.dS,r.hS].forEach(s=>{if(s!==null)c[Math.floor(s/2)]++;});
  [r.yB,r.mB,r.dB,r.hB].forEach(b=>{if(b!==null)c[branchElem(b)]++;});
  return c;
}
const kuuOf=r=>{const g=Math.floor(r.dIdx/10),k=(10-2*g+12)%12;return [k,k+1];};
function miniSlip(r,label){
  const cols=[['時',r.hS,r.hB],['日',r.dS,r.dB,1],['月',r.mS,r.mB],['年',r.yS,r.yB]];
  const td=(c,f)=>c[1]===null?'<td class="na">—</td>':f(c);
  return `<section class="slip mini" aria-label="${label}の命式"><h2 class="slip-h">${label}</h2><div class="slip-scroll"><table class="slip-table">
  <thead><tr>${cols.map(c=>`<th scope="col">${c[0]}</th>`).join('')}</tr></thead><tbody>
  <tr>${cols.map(c=>td(c,c=>`<td class="tg">${c[3]?'<span class="seal">日主</span>':tenGod(r.dS,c[1])}</td>`)).join('')}</tr>
  <tr>${cols.map(c=>td(c,c=>`<td class="big e${Math.floor(c[1]/2)}">${STEMS[c[1]]}</td>`)).join('')}</tr>
  <tr>${cols.map(c=>td(c,c=>`<td class="big e${branchElem(c[2])}">${BRANCHES[c[2]]}</td>`)).join('')}</tr>
  </tbody></table></div></section>`;
}
function renderPair(a,b,isSample){
  const now=Date.now();
  const ra=compute(a,now), rb=compute(b,now);
  const A=ra.dS,B=rb.dS,eA=Math.floor(A/2),eB=Math.floor(B/2);
  let score=50;
  let stemText;
  if(Math.abs(A-B)===5){score+=20;stemText=T.PAIR.kango(A,B);}
  else{const d=(eB-eA+5)%5;
    if(d===0){score+=4;stemText=T.PAIR.same;}
    else if(d===1){score+=10;stemText=T.PAIR.aGivesB;}
    else if(d===4){score+=10;stemText=T.PAIR.bGivesA;}
    else if(d===2){score-=6;stemText=T.PAIR.aRulesB;}
    else{score-=6;stemText=T.PAIR.bRulesA;}}
  const x=ra.dB,y=rb.dB;
  const HE=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
  let brText;
  if(x===y){score+=2;brText=T.PAIR.brSame(BRANCHES[x]);}
  else if((x+6)%12===y){score-=15;brText=T.PAIR.brClash;}
  else if(HE.some(([p,q])=>(p===x&&q===y)||(p===y&&q===x))){score+=12;brText=T.PAIR.brHe;}
  else if(x%4===y%4){score+=8;brText=T.PAIR.brSan;}
  else brText=T.PAIR.brNone;
  const ca=elemCount(ra),cb=elemCount(rb);
  const comp=[];
  for(let i=0;i<5;i++){
    if(ca[i]===0&&cb[i]===0){score-=4;comp.push(`二人とも${ELEM[i]}を持っていません。同じ穴を抱えているので、苦手な場面では二人そろって落ちます。`);}
    else if(ca[i]===0&&cb[i]>=2){score+=5;comp.push(`あなたに欠けている${ELEM[i]}を、相手がたっぷり持っています。あなたの足りない部分を、黙って埋めてくれる相手です。`);}
    else if(cb[i]===0&&ca[i]>=2){score+=5;comp.push(`相手に欠けている${ELEM[i]}を、あなたが持っています。相手にとってあなたは、自分にないものをくれる人です。`);}
  }
  if(!comp.length)comp.push('五行の面では、特に補い合う関係でも、同じ穴を抱える関係でもありません。足りないものは、二人の外から持ってくる必要があります。');
  const kuu=[];
  if(kuuOf(ra).includes(y)){score-=5;kuu.push(T.PAIR.kuuA);}
  if(kuuOf(rb).includes(x)){score-=5;kuu.push(T.PAIR.kuuB);}
  if(!kuu.length)kuu.push(T.PAIR.kuuNone);
  score=Math.max(5,Math.min(98,score));
  const v=T.VERDICT.find(t=>score>=t[0]);
  const tAB=tenGod(A,B),tBA=tenGod(B,A);
  const meta=p=>[`${p.y}年${p.m}月${p.d}日`,p.timeKnown?`${pad(p.hh)}:${pad(p.mm)}`:'時刻不明',p.placeName].join('　');
  shareText=`【容赦なき四柱推命・相性】\n相性度${score}点。${v[1]}\n私から見た相手は「${T.REL[tAB][0]}」、相手から見た私は「${T.REL[tBA][0]}」でした。\n#容赦なき四柱推命`;
  $('result').innerHTML=`
  ${isSample?'<p class="sample">これはサンプル鑑定です（1990年6月15日 東京都生まれ × 1988年11月3日 大阪府生まれ）。上のフォームに2人の生年月日を入れてください。</p>':''}
  <p class="meta"><span class="who">あなた</span>${meta(a)}<br><span class="who">相手</span>${meta(b)}</p>
  <div class="pair-slips">${miniSlip(ra,'あなた')}${miniSlip(rb,'相手')}</div>
  <section class="block">
    <p class="eyebrow">相性度</p>
    <div class="score"><span class="score-n">${score}</span><span class="score-of">/ 100</span></div>
    <h2>${v[1]}</h2>
    <p class="pair-names">${STEMS[A]}・${T.DAY[A].img} の あなた　×　${STEMS[B]}・${T.DAY[B].img} の 相手</p>
    <p>${v[2]}</p>
  </section>
  <section class="block">
    <p class="eyebrow">惹かれ合う力 ― 日干の関係</p>
    <h2>${STEMS[A]}と${STEMS[B]}</h2>
    <p>${stemText}</p>
  </section>
  <section class="block">
    <p class="eyebrow">暮らしの相性 ― 日支の関係</p>
    <h2>${BRANCHES[x]}と${BRANCHES[y]}</h2>
    <p class="${(x+6)%12===y?'warn':''}">${brText}</p>
  </section>
  <section class="block">
    <p class="eyebrow">補い合い ― 五行</p>
    <div class="pair-bars">${[0,1,2,3,4].map(i=>`<div class="pb-row"><span class="pb-n">${ca[i]}</span><span class="pb-l"><span class="bar-fill f${i}" style="width:${Math.min(100,ca[i]/4*100)}%"></span></span><span class="bar-k e${i}">${ELEM[i]}</span><span class="pb-r"><span class="bar-fill f${i}" style="width:${Math.min(100,cb[i]/4*100)}%"></span></span><span class="pb-n">${cb[i]}</span></div>`).join('')}<div class="pb-legend"><span>あなた</span><span>相手</span></div></div>
    ${comp.map(t=>`<p>${t}</p>`).join('')}
  </section>
  <section class="block">
    <p class="eyebrow">あなたから見た相手</p>
    <h2><span class="chip big-chip">${tAB}</span>${T.REL[tAB][0]}</h2>
    <p>${T.REL[tAB][1]}</p>
  </section>
  <section class="block">
    <p class="eyebrow">相手から見たあなた</p>
    <h2><span class="chip big-chip">${tBA}</span>${T.REL[tBA][0]}</h2>
    <p>${T.REL[tBA][1]}</p>
  </section>
  <section class="block">
    <p class="eyebrow">天中殺の干渉</p>
    ${kuu.map(t=>`<p>${t}</p>`).join('')}
  </section>
  ${shareHtml()}`;
  bindShare();
}
function shareHtml(){return `<section class="share">
    <a class="btn" href="https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">結果をXでポスト</a>
    <button type="button" class="btn ghost" id="copyBtn">結果の文面をコピー</button>
    <textarea id="copyFallback" readonly hidden aria-label="共有用の文面"></textarea>
    <p id="copyMsg" class="muted" aria-live="polite"></p>
  </section>`;}
function bindShare(){
  $('copyBtn').addEventListener('click',()=>{
    const done=()=>{$('copyMsg').textContent='コピーしました';};
    const fail=()=>{const t=$('copyFallback');t.value=shareText;t.hidden=false;t.select();$('copyMsg').textContent='自動でコピーできませんでした。上の文面を選択してコピーしてください。';};
    try{navigator.clipboard.writeText(shareText).then(done,fail);}catch(e){fail();}
  });
}

let mode='solo';const last={solo:null,pair:null};
function setMode(m,fromHash){
  mode=m;$('form').dataset.mode=m;$('fs-b').hidden=m!=='pair';
  $('tab-solo').setAttribute('aria-selected',String(m==='solo'));
  $('tab-pair').setAttribute('aria-selected',String(m==='pair'));
  $('submitBtn').textContent=m==='pair'?'相性を見る':'鑑定する';
  $('formErr').textContent='';
  if(!fromHash){try{location.hash=m==='pair'?'aisho':'';}catch(e){}}
  if(last[m])last[m]();else if(m==='pair')renderPair(SAMPLE_A,SAMPLE_B,true);else render(SAMPLE_A,true);
}
$('tab-solo').addEventListener('click',()=>{if(mode!=='solo')setMode('solo');});
$('tab-pair').addEventListener('click',()=>{if(mode!=='pair')setMode('pair');});
window.addEventListener('hashchange',()=>{const m=location.hash==='#aisho'?'pair':'solo';if(m!==mode)setMode(m,true);});

const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const a=readForm('a',mode==='pair'?'あなた':'');
  if(a.err){$('formErr').textContent=a.err;return;}
  let b=null;
  if(mode==='pair'){b=readForm('b','相手');if(b.err){$('formErr').textContent=b.err;return;}}
  $('formErr').textContent='';
  const fn=mode==='pair'?()=>renderPair(a,b,false):()=>render(a,false);
  last[mode]=fn;
  const res=$('result');
  if(reduce){fn();res.scrollIntoView();return;}
  res.innerHTML=`<div class="casting" aria-live="polite"><span id="castChar">甲</span><p>${mode==='pair'?'二人の命式を照らし合わせています':'命式を算出しています'}</p></div>`;
  res.scrollIntoView({behavior:'smooth',block:'start'});
  let i=0;const tm=setInterval(()=>{const c=$('castChar');if(c)c.textContent=(i%2?BRANCHES[i%12]:STEMS[i%10]);i++;},80);
  setTimeout(()=>{clearInterval(tm);fn();},1400);
});

fillForm('a',SAMPLE_A);fillForm('b',SAMPLE_B);
setMode(location.hash==='#aisho'?'pair':'solo',true);

</script>
</body>
</html>
